<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:540px;height:960px;overflow:hidden;background:#B9E7CB;
 font-family:"Poppins","Noto Sans",sans-serif;color:#0B3D2E}
#stage{position:relative;width:540px;height:960px;
 background:
  radial-gradient(500px 360px at 12% 8%, rgba(14,159,110,.34), rgba(14,159,110,0) 70%),
  radial-gradient(580px 440px at 90% 86%, rgba(255,196,64,.38), rgba(255,196,64,0) 70%),
  radial-gradient(700px 520px at 55% 45%, rgba(120,220,170,.35), rgba(120,220,170,0) 75%),
  #B9E7CB}
.scene{position:absolute;inset:0;opacity:0;z-index:1}
#capzone{z-index:2}
#brand{z-index:2}
.pill{position:absolute;top:64px;left:50%;transform:translateX(-50%);white-space:nowrap;
 font-size:12.5px;font-weight:800;letter-spacing:2.6px;color:#fff;
 border-radius:999px;padding:8px 18px;background:#0B3D2E;box-shadow:4px 5px 0 rgba(11,61,46,.35)}
.head{position:absolute;top:104px;left:0;width:540px;text-align:center;font-family:"Poppins",sans-serif}
.head .l1{font-size:39px;font-weight:800;line-height:1.16;color:#0B3D2E}
.head .l2{font-size:39px;font-weight:800;line-height:1.16;font-style:italic;color:#0E9F6E;position:relative;display:inline-block}
.head .l2 .und{position:absolute;left:2%;bottom:-7px;width:96%;height:8px}
.head .w{display:inline-block}
.card{position:absolute;top:262px;left:50%;width:452px;height:392px;margin-left:-226px;
 background:#fff;border:2.5px solid #0B3D2E;border-radius:30px;
 box-shadow:10px 12px 0 rgba(11,61,46,.9);overflow:hidden;z-index:2}
.card .inner{position:absolute;inset:0;padding:24px 28px;display:flex;flex-direction:column;align-items:center}
.hero{font-size:96px;line-height:1.1;margin-top:16px;text-align:center}
.bigtext{font-size:64px;font-weight:800;text-align:center;margin-top:26px;color:#0B3D2E;line-height:1.08}
.bigtext .g{color:#0E9F6E}
.bigsub{font-size:19px;font-weight:700;color:rgba(11,61,46,.62);text-align:center;margin-top:8px}
.rows{margin-top:20px;display:flex;flex-direction:column;gap:11px;width:100%;align-items:center}
.rrow{display:flex;align-items:center;gap:11px;background:#0B3D2E;color:#fff;font-size:18.5px;font-weight:700;
 padding:9px 17px;border-radius:12px;opacity:0}
.rrow.g{background:#0E9F6E}
.rrow .ic{font-size:20px}
.foot{position:absolute;bottom:20px;left:0;width:100%;text-align:center;font-size:15.5px;font-weight:700;color:rgba(11,61,46,.6);opacity:0;padding:0 26px}
.barwrap{width:88%;margin-top:26px}
.bar2{height:17px;border-radius:9px;background:rgba(11,61,46,.12);overflow:hidden}
.bar2 i{display:block;height:100%;width:0;background:linear-gradient(90deg,#37C978,#0E9F6E)}
.errchip{margin-top:16px;background:#C0392B;color:#fff;font-weight:800;font-size:16.5px;padding:8px 16px;border-radius:11px;opacity:0}
.codelines{margin-top:20px;font-family:"DejaVu Sans Mono",monospace;font-size:16.5px;line-height:1.75;color:rgba(11,61,46,.75);text-align:left;width:88%}
.cross{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:150px;opacity:0}
.quote{font-size:27px;font-weight:800;font-style:italic;text-align:center;line-height:1.4;margin-top:44px;color:#0B3D2E;padding:0 8px}
.lockic{font-size:88px;margin-top:30px}
.typeline{margin-top:56px;font-size:23px;font-weight:800;text-align:center;line-height:1.45;min-height:70px;color:#0B3D2E;padding:0 10px}
.typeline .caret{color:#0E9F6E}
.vs{display:flex;gap:14px;width:100%;margin-top:30px}
.vsA,.vsB{flex:1;border-radius:16px;padding:20px 10px;text-align:center;opacity:0}
.vsA{background:rgba(192,57,43,.1);border:2px solid rgba(192,57,43,.45)}
.vsB{background:rgba(14,159,110,.12);border:2px solid #0E9F6E}
.vs .vt{font-size:15px;font-weight:800;letter-spacing:1.6px}
.vs .vp{font-size:37px;font-weight:800;margin-top:7px}
.vsA .vp{color:#C0392B}.vsB .vp{color:#0E9F6E}
.wmbox{margin-top:14px;border:2px dashed rgba(11,61,46,.35);border-radius:12px;padding:12px 20px;position:relative;overflow:hidden}
.wmbox .wmt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:800;color:rgba(11,61,46,.16);transform:rotate(-14deg);letter-spacing:3px}
.wmbox .wmi{font-size:34px;text-align:center;position:relative}
#capzone{position:absolute;left:0;bottom:100px;width:540px;display:flex;justify-content:flex-start;align-items:flex-end;gap:6px;padding:0 18px}
#charwrap{width:172px;height:184px;flex:none;position:relative}
#charwrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:bottom center;filter:drop-shadow(0 10px 14px rgba(11,61,46,.28))}
#bubble{background:#fff;border:2px solid #0B3D2E;border-radius:18px;box-shadow:6px 7px 0 rgba(11,61,46,.9);
 padding:13px 17px;font-family:"Poppins",sans-serif;font-size:19.5px;font-weight:700;line-height:1.35;max-width:330px;min-height:56px;color:#0B3D2E}
#bubble .cw{display:inline-block}
#bubble .hot{color:#0E9F6E;font-style:italic}
#brand{position:absolute;bottom:60px;left:0;width:540px;text-align:center;font-size:12px;font-weight:700;letter-spacing:2.2px;color:rgba(11,61,46,.55)}
.ambient{position:absolute;inset:0;overflow:hidden;z-index:1}
.sketch{position:absolute;inset:0;z-index:1;pointer-events:none}
.amb{position:absolute;color:#0E9F6E;font-weight:700;opacity:.13;line-height:1}
.dots{position:absolute;inset:0;z-index:0;background-image:radial-gradient(circle, rgba(11,61,46,.14) 1.6px, transparent 1.9px);background-size:26px 26px}
#sticker{position:absolute;left:452px;top:50px;width:58px;height:58px;background:#fff;border:2.5px solid #0B3D2E;border-radius:50%;box-shadow:4px 5px 0 rgba(11,61,46,.9);display:flex;align-items:center;justify-content:center;font-size:30px;opacity:0;z-index:5}
</style></head><body>
<div id="stage"></div>
<script>
const DATA = /*DATA*/;
const SCENES = /*SCENES*/;
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const eoc=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eob=x=>{const c=1.70158,c3=c+1;return 1+c3*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const stage=$('#stage');
SCENES.forEach((S,i)=>{
 S.idx=i;
 const d=document.createElement('div');d.className='scene';d.id='sc'+i;
 let card='';
 const C=S.card||{};
 if(C.kind==='versus'){ card=`<div class="vs"><div class="vsA"><div class="vt">CLAUDE PRO</div><div class="vp">₹2,000</div><div class="bigsub" style="font-size:15px">har mahina</div></div><div class="vsB"><div class="vt">FREE TOOL</div><div class="vp">₹0</div><div class="bigsub" style="font-size:15px">try bilkul free</div></div></div>` }
 else{
  if(C.hero)card+=`<div class="hero">${C.hero}</div>`;
  if(C.big)card+=`<div class="bigtext">${C.big}</div>`;
  if(C.bigsub)card+=`<div class="bigsub">${C.bigsub}</div>`;
  if(C.kind==='code')card+=`<div class="codelines">&gt; npm run render<br>&nbsp;&nbsp;scene_01 … compiling<br>&nbsp;&nbsp;scene_02 … compiling<br>&nbsp;&nbsp;error: limit reached ✕</div><div class="cross">❌</div>`;
  if(C.kind==='bar')card+=`<div class="barwrap"><div class="bar2"><i></i></div></div><div class="errchip">⚠ Render Error · Limit Khatm</div>`;
  if(C.kind==='quote')card+=`<div class="quote">"Pro wale bhaiya,<br>ab EDITOR bhi ban jao!"</div>`;
  if(C.kind==='lock')card+=`<div class="lockic">🔒</div>`;
  if(C.kind==='typing')card+=`<div class="typeline"><span class="tt"></span><span class="caret">▍</span></div>`;
  if(C.kind==='wm')card+=`<div class="wmbox"><div class="wmt">watermark</div><div class="wmi">🎬 meri-reel.mp4</div></div>`;
  if(C.rows)card+=`<div class="rows">${C.rows.map(r=>`<div class="rrow${r[2]?' g':''}"><span class="ic">${r[0]}</span>${r[1]}</div>`).join('')}</div>`;
  if(C.foot)card+=`<div class="foot">${C.foot}</div>`;
 }
 d.innerHTML=`<div class="pill">${S.pill}</div>
 <div class="head"><div class="l1">${S.l1.split(' ').map(w=>`<span class="w">${w}</span>`).join(' ')}</div>
 <span class="l2"><span class="fill">${S.l2}</span><svg class="und" viewBox="0 0 100 8" preserveAspectRatio="none"><path d="M1 5 Q 25 1 50 4 T 99 3" stroke="#0E9F6E" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".65"/></svg></span></div>
 <div class="dots"></div>
 <div class="ambient"></div>
 <svg class="sketch" viewBox="0 0 540 960" width="540" height="960">
 <path class="wv" d="M-20 700 Q 25 683 70 700 T 160 700 T 250 700 T 340 700 T 430 700 T 520 700 T 610 700" stroke="#0E9F6E" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-dasharray="16 12" opacity=".20"/>
 <path class="wv" d="M-20 736 Q 25 722 70 736 T 160 736 T 250 736 T 340 736 T 430 736 T 520 736 T 610 736" stroke="#0B3D2E" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="13 11" opacity=".12"/>
 </svg>
 <div class="card"><div class="inner">${card}</div></div>`;
 stage.appendChild(d);
});
const cz=document.createElement('div');cz.id='capzone';
cz.innerHTML=`<div id="charwrap"><img id="chBot"><img id="chTop"></div><div id="bubble"></div><div id="sticker"></div>`;stage.appendChild(cz);
const br=document.createElement('div');br.id='brand';br.textContent='✳ I.RAJ1801';stage.appendChild(br);
const L=DATA.lines;
const phrases=[];
L.forEach((ln,li)=>{for(let i=0;i<ln.words.length;i+=3)phrases.push({li,words:ln.words.slice(i,i+3)})});
function sceneAt(t){for(let i=SCENES.length-1;i>=0;i--)if(t>=SCENES[i].t0)return i;return 0}
function seek(t){
 const si=sceneAt(t), S=SCENES[si], ln=L[si];
 const lp=clamp((t-ln.start)/ln.dur,0,1);
 SCENES.forEach((Sx,i)=>{
   const el=$('#sc'+i);let o=0;
   if(i===si)o=eio(clamp((t-Sx.t0)/0.3,0,1));
   else if(i===si-1&&t<Sx.t1+0.3)o=1-eio(clamp((t-Sx.t1+0.02)/0.3,0,1));
   el.style.opacity=o;
   const sc=1+(i===si?0.035*clamp((t-Sx.t0)/(Sx.t1-Sx.t0),0,1):0);
   el.querySelector('.card').style.transform=`scale(${sc})`;
   el.style.visibility=o<=0.001?'hidden':'visible';
 });
 const lt=t-S.t0, head=$('#sc'+si+' .head');
 head.querySelectorAll('.l1 .w').forEach((w,i)=>{const k=eoc(clamp((lt-0.05-i*0.06)/0.3,0,1));w.style.opacity=k;w.style.transform=`translateY(${(1-k)*10}px)`});
 const l2=$('#sc'+si+' .l2');const gk=clamp((lt-0.35)/0.45,0,1);
 l2.style.opacity=0.25+0.75*eio(gk); l2.style.filter=gk<1?`grayscale(${1-gk})`:'none';
 const inner=$('#sc'+si+' .inner'), C=S.card||{};
 const hero=inner.querySelector('.hero,.bigtext,.lockic');
 if(hero){const k=eob(clamp((lp-(C.heroAt||0.08))/0.3,0,1));hero.style.opacity=k;hero.style.transform=`scale(${0.55+0.45*k})`}
 inner.querySelectorAll('.rrow').forEach((r,i)=>{const at=(C.rowAt&&C.rowAt[i])||(0.25+i*0.22);const k=eob(clamp((lp-at)/0.28,0,1));r.style.opacity=k;r.style.transform=`translateY(${(1-k)*12}px) scale(${0.8+0.2*k})`});
 const foot=inner.querySelector('.foot');if(foot){const k=eoc(clamp((lp-(C.footAt||0.8))/0.3,0,1));foot.style.opacity=k}
 if(C.kind==='bar'){const f=inner.querySelector('.bar2 i');if(f)f.style.width=(eio(clamp(lp*1.15,0,1))*78)+'%';
   const ec=inner.querySelector('.errchip');if(ec){const k=eob(clamp((lp-0.7)/0.3,0,1));ec.style.opacity=k;ec.style.transform=`scale(${0.7+0.3*k})`}}
 if(C.kind==='code'){const cr=inner.querySelector('.cross');if(cr){const k=eob(clamp((lp-0.55)/0.3,0,1));cr.style.opacity=k*0.92;cr.style.transform=`scale(${0.6+0.4*k}) rotate(-8deg)`}
   const cl=inner.querySelector('.codelines');if(cl)cl.style.opacity=0.35+0.65*eoc(clamp(lp/0.3,0,1))}
 if(C.kind==='typing'){const tt=inner.querySelector('.tt');if(tt){const full='मेरी agency की reel बना दो';const chars=Math.floor(clamp((lp-0.15)/0.6,0,1)*full.length);tt.textContent=full.slice(0,chars);
   const car=inner.querySelector('.caret');if(car)car.style.opacity=(Math.sin(t*7)>0||lp>0.8)?1:0.15}}
 if(C.kind==='versus'){const a=inner.querySelector('.vsA'),b=inner.querySelector('.vsB');
   if(a){const k=eoc(clamp((lp-0.05)/0.3,0,1));a.style.opacity=k;a.style.transform=`translateX(${(1-k)*-24}px)`}
   if(b){const k=eoc(clamp((lp-0.45)/0.3,0,1));b.style.opacity=k;b.style.transform=`translateX(${(1-k)*24}px)`}}
 // character poses (library) — crossfade 0.25s
 const EXPR=DATA.expr; let k2=0; for(let i=0;i<EXPR.length;i++){ if(t>=EXPR[i][0]) k2=i }
 const cT=$('#chTop'), cB=$('#chBot'), curE=EXPR[k2][1], since=t-EXPR[k2][0];
 if(since<0.25 && k2>0){ const prv=EXPR[k2-1][1];
   if(cB.dataset.e!==prv){cB.src='poses/'+prv+'.png';cB.dataset.e=prv}
   if(cT.dataset.e!==curE){cT.src='poses/'+curE+'.png';cT.dataset.e=curE}
   cB.style.opacity=1; cT.style.opacity=(since/0.25).toFixed(3);
 } else {
   if(cT.dataset.e!==curE){cT.src='poses/'+curE+'.png';cT.dataset.e=curE}
   cT.style.opacity=1; cB.style.opacity=0;
 }
 // bg layers: dots drift, sketch waves, ambient glyphs, stickers
 const scEl=$('#sc'+si);
 const sk=scEl.querySelector('.sketch');
 if(sk)sk.querySelectorAll('.wv').forEach(p=>p.setAttribute('stroke-dashoffset',(-t*55).toFixed(1)));
 const dt2=scEl.querySelector('.dots'); if(dt2)dt2.style.backgroundPosition=((t*5)%26).toFixed(1)+'px '+((t*2)%26).toFixed(1)+'px';
 const stk=$('#sticker'); let actS=null; for(const pr of DATA.stk){ if(t>=pr[0] && t<pr[0]+1.7) actS=pr }
 if(actS){ const lt2=t-actS[0]; const pp=Math.min(1,lt2/0.28); const bo=1+2.70158*Math.pow(pp-1,3)+1.70158*Math.pow(pp-1,2); const fo=lt2>1.4?Math.max(0,(1.7-lt2)/0.3):1;
   if(stk.dataset.e!==actS[1]){ stk.textContent=actS[1]; stk.dataset.e=actS[1] }
   stk.style.opacity=fo.toFixed(2); stk.style.transform='translateY('+(Math.sin(lt2*3.2)*3.5).toFixed(1)+'px) scale('+bo.toFixed(3)+')';
 } else stk.style.opacity=0;
 const amb=scEl.querySelector('.ambient');
 if(amb && !amb.dataset.built){ amb.dataset.built='1'; let h=''; for(let i=0;i<18;i++)h+='<span class="amb"></span>'; amb.innerHTML=h }
 const GLYPH=[['♪','✦','●','♫'],['○','●','✦','●'],['↑','✦','●','↑'],['★','●','✦','♪']];
 if(amb){ const set=GLYPH[si%4];
   amb.querySelectorAll('.amb').forEach((sp,i)=>{ const off=(i*0.618)%1;
     sp.textContent=set[i%4];
     sp.style.left=(4+((i*67)%92))+'%';
     sp.style.top=(88-((t*2.6+off*74)%74))+'%';
     sp.style.fontSize=(22+((i*11)%20))+'px';
     sp.style.opacity=(0.12+((i*7)%10)/100).toFixed(2);
     sp.style.transform='translateX('+(Math.sin(t*0.5+i*1.7)*10).toFixed(1)+'px)';
   }) }
 // bubble phrases
 let cur=null;for(const p of phrases){if(t>=p.words[0].s-0.02)cur=p}
 const bub=$('#bubble');
 if(cur){const key=cur.li+'-'+cur.words[0].s;
   if(bub.dataset.k!==key){bub.dataset.k=key;bub.innerHTML=cur.words.map(w=>`<span class="cw${(SCENES[cur.li].kw||[]).includes(w.w)?' hot':''}" data-s="${w.s}">${w.w}</span>`).join(' ')}
   bub.querySelectorAll('.cw').forEach(el=>{const s=parseFloat(el.dataset.s);
     el.style.transform=`scale(${t>=s?1+0.1*Math.sin(clamp((t-s)/0.32,0,1)*Math.PI):1})`;el.style.opacity=t>=s-0.02?1:0.28});
 } else bub.innerHTML='';
}
window.seek=seek;seek(0);
</script></body></html>
