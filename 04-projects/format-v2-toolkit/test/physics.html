<script type="module">
import * as THREE from 'three';
import * as RAPIER from '@dimforge/rapier3d-compat';
import { EffectComposer, RenderPass, EffectPass, BloomEffect } from 'postprocessing';
await RAPIER.init();
const world = new RAPIER.World({ x: 0, y: -9.81, z: 0 });
world.createCollider(RAPIER.ColliderDesc.cuboid(10, 0.5, 10).setTranslation(0, -0.5, 0));
const ball = world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(0, 5, 0));
world.createCollider(RAPIER.ColliderDesc.ball(0.5).setRestitution(0.8), ball);
const ys = [];
for (let i = 0; i < 150; i++) { world.step(); ys.push(+ball.translation().y.toFixed(2)); }
const minY = Math.min(...ys.slice(10));
const bounced = ys.slice(ys.indexOf(minY)).some(y => y > minY + 0.8);
const renderer = new THREE.WebGLRenderer({ canvas: document.createElement('canvas'), antialias: true });
const scene = new THREE.Scene(); const cam = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
const comp = new EffectComposer(renderer);
comp.addPass(new RenderPass(scene, cam));
comp.addPass(new EffectPass(cam, new BloomEffect({ intensity: 1.2 })));
document.title = 'DONE';
window.RESULT = { start: ys[0], minY, bounced, last: ys[ys.length - 1], composer: !!comp, three: THREE.REVISION };
</script>
