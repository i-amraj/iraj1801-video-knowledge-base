<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:540px;height:960px;overflow:hidden;background:#B9E7CB;

#stage{position:relative;width:540px;height:960px;

  radial-gradient(500px 360px at 12% 8%, rgba(14,159,110,.34), rgba(14,159,110,0) 70%),

  #B9E7CB}
#stage:before{content:"";position:absolute;inset:0;opacity:0;
 background:repeating-conic-gradient(from -90deg at 50% 34%, rgba(184,103,74,.045) 0deg 4deg, transparent 4deg 9deg)}
#stage:after{content:"";position:absolute;inset:0;opacity:0;
 background-image:radial-gradient(rgba(22,18,15,.13) 1px, transparent 1.4px);background-size:22px 22px}
.scene{position:absolute;inset:0;opacity:0;z-index:1}
#capzone{z-index:2}
#brand{z-index:2}
.pill{position:absolute;top:64px;left:50%;transform:translateX(-50%);white-space:nowrap;
 font-size:12.5px;font-weight:800;letter-spacing:2.6px;color:#fff;
 border-radius:999px;padding:8px 18px;background:#0B3D2E;box-shadow:4px 5px 0 rgba(11,61,46,.35)}
.head{position:absolute;top:104px;left:0;width:540px;text-align:center;font-family:"Poppins",sans-serif}
.head .l1{font-size:40px;font-weight:800;line-height:1.16;color:#0B3D2E}
.head .l2{font-size:40px;font-weight:800;line-height:1.16;font-style:italic;color:#0E9F6E;position:relative;display:inline-block}
.head .l2 .und{position:absolute;left:2%;bottom:-7px;width:96%;height:8px}
.head .w{display:inline-block}
.card{position:absolute;top:262px;left:50%;width:452px;height:392px;margin-left:-226px;
 background:#fff;border:2.5px solid #0B3D2E;border-radius:30px;
 box-shadow:10px 12px 0 rgba(11,61,46,.9);overflow:hidden}
.card .inner{position:absolute;inset:0;padding:26px 28px}
/* S1 phone */
.phone{width:172px;height:308px;margin:14px auto 0;border-radius:24px;background:#14161a;
 box-shadow:0 14px 30px rgba(20,20,20,.35);padding:12px 10px;position:relative}
.phone .notch{width:56px;height:7px;border-radius:4px;background:#2c2f36;margin:0 auto 10px}
.phone .pline{font-family:"Poppins",sans-serif;font-size:16.5px;line-height:1.5;color:#5c6068;font-weight:600}
.phone .pline b{color:#fff;font-weight:800}
.phone .pline .hot{color:#ff9d5c}
.autobadge{position:absolute;right:-52px;top:118px;background:#0E9F6E;color:#fff;font-weight:800;
 font-size:13px;letter-spacing:1.4px;padding:8px 13px;border-radius:999px;box-shadow:0 8px 18px rgba(11,61,46,.4)}
/* S2 diagram */
.dia-t{font-size:12px;font-weight:800;letter-spacing:2.2px;color:rgba(11,61,46,.55);text-align:center;margin-bottom:16px}
.microw{display:flex;align-items:center;gap:16px}
.mic{width:58px;height:58px;border-radius:50%;background:#0B3D2E;color:#fff;display:flex;align-items:center;justify-content:center;font-size:27px;flex:none}
.wave{display:flex;align-items:center;gap:3.5px;height:64px;flex:1}
.wave i{flex:1;background:#0E9F6E;border-radius:3px;min-height:4px}
.arrow{font-size:26px;color:#0E9F6E;font-weight:900;text-align:center;margin:12px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.chip{background:#0B3D2E;color:#fff;font-size:14.5px;font-weight:700;padding:6px 11px;border-radius:9px;opacity:0}
.chip.hot{background:#0E9F6E}
.capstrip{margin-top:20px;background:#0B3D2E;border-radius:13px;padding:12px 14px;font-family:"Poppins",sans-serif;font-size:16.5px;font-weight:700;color:#fff;text-align:center;opacity:0}
.capstrip .hot{color:#7CF2C0}

.upbox{border:2px dashed rgba(11,61,46,.4);border-radius:20px;padding:22px 18px;text-align:center;background:#F4FBF6}
.upicon{width:62px;height:62px;margin:0 auto;border-radius:50%;background:#0E9F6E;color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center;font-family:"Poppins",sans-serif;font-weight:800}
.filechip{display:inline-block;margin-top:10px;background:#0B3D2E;color:#fff;font-size:14px;font-weight:700;padding:7px 14px;border-radius:9px}
.upbar{height:13px;border-radius:8px;background:rgba(11,61,46,.12);margin-top:20px;overflow:hidden}
.upbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#37C978,#0E9F6E);border-radius:8px}
.uppct{font-family:"Poppins",sans-serif;font-size:29px;font-weight:800;margin-top:12px;color:#0B3D2E}
.upstat{font-size:13.5px;color:rgba(11,61,46,.6);font-weight:700;margin-top:2px}

.tl-t{font-size:12px;font-weight:800;letter-spacing:2.2px;color:rgba(11,61,46,.55);text-align:center;margin-bottom:14px}
.tlwave{display:flex;align-items:flex-end;gap:3px;height:56px;margin:0 4px}
.tlwave i{flex:1;background:rgba(11,61,46,.28);border-radius:3px;min-height:4px}
.track{position:relative;height:118px;margin-top:16px;background:rgba(11,61,46,.06);border-radius:14px}
.playhead{position:absolute;top:6px;bottom:6px;width:3px;background:#0E9F6E;border-radius:2px;left:0}
.blk{position:absolute;top:38px;height:42px;background:#0B3D2E;color:#fff;border-radius:8px;
 font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;opacity:0;padding:0 4px;overflow:hidden;white-space:nowrap}
.blk.hot{background:#0E9F6E}
.tlcap{text-align:center;font-size:13.5px;color:rgba(11,61,46,.6);font-weight:700;margin-top:12px}

#capzone{position:absolute;left:0;bottom:100px;width:540px;display:flex;justify-content:flex-start;align-items:flex-end;gap:6px;padding:0 18px}

     $('#wb'+i).style.height=(6+local*56)+'px';$('#wb'+i).style.opacity=t<ln.start?0.35:1}
   const cs=$('#capstrip');const ck=eoc(clamp((t-6.35)/0.4,0,1));cs.style.opacity=ck;cs.style.transform=`translateY(${(1-ck)*10}px)`;
   const chipT=[2.95,3.3,3.62,4.35,4.95,5.6,6.15];
   document.querySelectorAll('#chips .chip').forEach((c,i)=>{const k=eob(clamp((t-chipT[i])/0.3,0,1));c.style.opacity=k;c.style.transform=`scale(${0.5+0.5*k}) translateY(${(1-k)*8}px)`});
 }
 // S3 upload
 if(si===2){const ln=L[2];const p=eio(clamp((t-ln.start-0.15)/(ln.dur-0.3),0,1));
   $('#upfill').style.width=(p*100)+'%';$('#uppct').textContent=Math.round(p*100)+'%';
   $('#upstat').textContent=p>=1?'Upload ho gaya ✓':'Upload ho raha hai…';$('#upstat').style.color=p>=1?'#0E9F6E':'rgba(11,61,46,.6)';
 }
 // S4 timeline
 if(si===3){const ln=L[3];const p=clamp((t-ln.start)/ln.dur,0,1);
   $('#ph').style.left=(4+p*94)+'%';
   const bw=100/blkWords.length;
   document.querySelectorAll('#track .blk').forEach((b,i)=>{const w=blkWords[i];const k=eob(clamp((t-w.s)/0.28,0,1));
     b.style.opacity=k;b.style.left=(2+i*bw*0.94)+'%';b.style.width=(bw*0.88)+'%';b.style.transform=`translateY(${(1-k)*-16}px) scale(${0.7+0.3*k})`});
 }

 // 3D character: emotions script ke hisaab se har ~2-3s (crossfade 0.25s), koi bob/pulse nahi
 const EXPR=[[0,'neutral'],[0.15,'talking'],[2.88,'explaining'],[4.35,'listening'],[6.37,'grin'],[7.54,'pointing'],[10.21,'phone'],[12.70,'thumbsup'],[14.36,'wink']];
 let k=0; for(let i=0;i<EXPR.length;i++){ if(t>=EXPR[i][0]) k=i }
 const cT=$('#chTop'), cB=$('#chBot'), curE=EXPR[k][1], since=t-EXPR[k][0];
 if(since<0.25 && k>0){ const prv=EXPR[k-1][1];
   if(cB.dataset.e!==prv){cB.src='../cutouts2/'+prv+'.png';cB.dataset.e=prv}
   if(cT.dataset.e!==curE){cT.src='../cutouts2/'+curE+'.png';cT.dataset.e=curE}
   cB.style.opacity=1; cT.style.opacity=(since/0.25).toFixed(3);
 } else {
   if(cT.dataset.e!==curE){cT.src='../cutouts2/'+curE+'.png';cT.dataset.e=curE}
   cT.style.opacity=1; cB.style.opacity=0;
 }
 $('#charwrap').style.transform='none';
 // background ambient: har scene ke hisaab se halki chalti hui sajawat (card ke peeche)
 const scEl=$('#sc'+S.idx); const amb=scEl?scEl.querySelector('.ambient'):null;
 const sk=scEl?scEl.querySelector('.sketch'):null;
 if(sk){ sk.querySelectorAll('.wv').forEach(p=>p.setAttribute('stroke-dashoffset',(-t*55).toFixed(1)));
   const ar=sk.querySelector('.sk-arrow'); if(ar){ ar.setAttribute('opacity', S.idx===2?'.32':'0'); ar.setAttribute('transform','translate(0 '+(Math.sin(t*2.2)*4).toFixed(1)+')') }
   const tk=sk.querySelector('.sk-ticks'); if(tk){ tk.setAttribute('opacity', S.idx===3?'.30':'0'); const pp=Math.max(0,Math.min(1,(t-S.t0)/(S.t1-S.t0))); const line=tk.querySelector('.tk'); if(line) line.setAttribute('stroke-dashoffset',(100*(1-pp)).toFixed(1)) } }
 const dt2=scEl?scEl.querySelector('.dots'):null; if(dt2) dt2.style.backgroundPosition=((t*5)%26).toFixed(1)+'px '+((t*2)%26).toFixed(1)+'px';
 const STK=[[0.90,'✍️'],[4.35,'🎧'],[6.37,'✨'],[7.54,'📤'],[12.70,'🎯']];
 const stk=$('#sticker'); let actS=null; for(const pr of STK){ if(t>=pr[0] && t<pr[0]+1.7) actS=pr }
 if(stk){ if(actS){ const lt=t-actS[0]; const pp=Math.min(1,lt/0.28); const bo=1+2.70158*Math.pow(pp-1,3)+1.70158*Math.pow(pp-1,2); const fo=lt>1.4?Math.max(0,(1.7-lt)/0.3):1;
   if(stk.dataset.e!==actS[1]){ stk.textContent=actS[1]; stk.dataset.e=actS[1] }
   stk.style.opacity=fo.toFixed(2); stk.style.transform='translateY('+(Math.sin(lt*3.2)*3.5).toFixed(1)+'px) scale('+bo.toFixed(3)+')';
 } else stk.style.opacity=0 }
 if(amb && !amb.dataset.built){ amb.dataset.built='1'; let h='';
   for(let i=0;i<18;i++){ h+='<span class="amb" data-i="'+i+'"></span>' } amb.innerHTML=h }
 const GLYPH=[['♪','✦','●','♫'],['○','●','✦','●'],['↑','✦','●','↑'],['★','●','✦','♪']];
 if(amb){ const set=GLYPH[S.idx]||GLYPH[0];
   amb.querySelectorAll('.amb').forEach((sp,i)=>{ const off=(i*0.618)%1;
     sp.textContent=set[i%4];
     sp.style.left=(4+((i*67)%92))+'%';
     sp.style.top=(88-((t*2.6+off*74)%74))+'%';
     sp.style.fontSize=(22+((i*11)%20))+'px';
     sp.style.opacity=(0.12+((i*7)%10)/100).toFixed(2);
     sp.style.transform='translateX('+(Math.sin(t*0.5+i*1.7)*10).toFixed(1)+'px)';
   }) }
 // caption bubble: current phrase
 let cur=null;for(const p of phrases){if(t>=p.words[0].s-0.02)cur=p}
 const bub=$('#bubble');
 if(cur){const key=cur.li+'-'+cur.words[0].s;
   if(bub.dataset.k!==key){bub.dataset.k=key;bub.innerHTML=cur.words.map(w=>`<span class="cw${KW.has(w.w)?' hot':''}" data-s="${w.s}">${w.w}</span>`).join(' ')}
   bub.querySelectorAll('.cw').forEach(el=>{const s=parseFloat(el.dataset.s);const k=eob(clamp((t-s)/0.32,0,1));
     el.style.transform=`scale(${t>=s?1+0.1*Math.sin(clamp((t-s)/0.32,0,1)*Math.PI):1})`;el.style.opacity=t>=s-0.02?1:0.28});
 } else bub.innerHTML='';
}
